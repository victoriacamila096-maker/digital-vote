<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote Submitted</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to bottom right, #ffffff, #f0f0f0);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      animation: fadeIn 1.5s ease;
    }

    .btn-home {
      display: inline-block;
      background-color: #008000;
      color: white;
      padding: 15px 30px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 30px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(0, 128, 0, 0.4);
    }

    .btn-home:hover {
      background-color: #006400;
      transform: scale(1.05);
    }

    h1 {
      font-size: 2rem;
      color: #222;
      margin-bottom: 10px;
      animation: slideDown 1s ease;
    }

    p {
      font-size: 1.2rem;
      color: #444;
      margin-bottom: 30px;
      animation: slideDown 1.3s ease;
    }

    .checkmark {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      animation: pop 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      0% { transform: scale(0); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn-home">GO BACK TO HOME</a>
    <h1>Thank you for voting <span style="font-size: 1.5rem;">&#128077;&#10024;</span></h1>
    <p>We will notify you when your vote has counted...</p>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Yes_Check_Circle.svg/2048px-Yes_Check_Circle.svg.png" alt="Success" class="checkmark">
  </div>

  <script>
    // Animate background shift
    document.body.style.transition = "background 2s ease-in-out";
    setTimeout(() => {
      document.body.style.background = "linear-gradient(to bottom right, #e0ffe0, #f0fff0)";
    }, 2000);

    // Flashing emoji animation
    const emoji = document.querySelector('h1 span');
    setInterval(() => {
      emoji.style.opacity = emoji.style.opacity === '0' ? '1' : '0';
    }, 600);
  </script>
</body>
</html>
